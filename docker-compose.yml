version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hairdresser-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "9998:5432"

  app:
    build: .
    container_name: hairdresser-booking-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://booking:booking@db:5432/booking?schema=public"
      JWT_SECRET: "change-me-to-a-long-random-string"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin12345"
      SLOT_STEP_MINUTES: "15"
      PORT: "9999"
      TZ: "Europe/Moscow"
    ports:
      - "9999:9999"

  # Weekly cleanup: every Sunday at 00:00 (server local time, see TZ below)
  # this permanently deletes every appointment that has already ended — no
  # history is kept anywhere, by design. Separate long-running process from
  # `app` so it survives independently of app restarts/deploys. See
  # scripts/scheduler.ts and README.md "Автоочистка старых записей".
  scheduler:
    build:
      context: .
      target: scheduler
    container_name: hairdresser-booking-scheduler
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://booking:booking@db:5432/booking?schema=public"
      TZ: "Europe/Moscow" # change to your salon's time zone
      # PURGE_CRON: "0 0 * * 0"  # override cadence if needed (default: Sunday 00:00)

volumes:
  db_data:
